<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>回忆墙墙 · MEMORY WALL</title>
<meta name="description" content="回忆墙墙 —— 轻触，散落的光会重新聚拢。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Serif+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

<!-- 背景层 -->
<canvas id="fx" aria-hidden="true"></canvas>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <span class="brand-cn">回忆墙墙</span>
    <span class="brand-en">MEMORY&nbsp;WALL</span>
  </div>
  <button class="sound" id="soundBtn" type="button" aria-pressed="true" title="音效开关">
    <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3.2L12 19V5L7.2 9H4z"/><path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M17.8 6.2a8 8 0 0 1 0 11.6"/></svg>
    <svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3.2L12 19V5L7.2 9H4z"/><path d="M16 9.5l4 5M20 9.5l-4 5"/></svg>
    <span class="sound-label">音效</span>
  </button>
</header>

<!-- 主界面：回忆墙 -->
<main class="stage" id="stage">
  <span class="halo" aria-hidden="true"></span>
  <span class="rule" aria-hidden="true"></span>
  <h1 class="title" id="title" aria-label="回忆墙墙">
    <span class="ch" style="--i:0">回</span><span class="ch" style="--i:1">忆</span><span class="ch" style="--i:2">墙</span><span class="ch" style="--i:3">墙</span>
  </h1>
  <span class="rule" aria-hidden="true"></span>
  <p class="hint" id="hint"><i class="dot"></i><span>轻触开启 · TAP TO OPEN</span></p>
  <button class="open-zone" id="openZone" type="button" aria-label="开启回忆墙"></button>
</main>

<!-- 回忆墙 -->
<section class="wall" id="wall" aria-hidden="true">
  <div class="wall-inner">
    <div class="wall-head">
      <span class="wl-line" aria-hidden="true"></span>
      <span class="wl-text">回 忆 墙 墙</span>
      <span class="wl-line" aria-hidden="true"></span>
    </div>
    <p class="wall-sub">两帧光，折叠成一面墙。</p>

    <div class="frames" id="frames">
      <figure class="frame-wrap" data-src="assets/memory-1.jpg" data-cap="夜巡 · 幽廊" style="--i:0;--r:-1.6deg;--ty:-16px">
        <div class="frame">
          <span class="nail" aria-hidden="true"></span>
          <div class="frame-mat">
            <img src="assets/memory-1.jpg" alt="回忆 01 · 夜巡幽廊" draggable="false">
          </div>
          <span class="gloss" aria-hidden="true"></span>
        </div>
        <figcaption><span class="no">01</span><span class="cap">夜巡 · 幽廊</span></figcaption>
      </figure>

      <figure class="frame-wrap" data-src="assets/memory-2.jpg" data-cap="花信 · 琴房" style="--i:1;--r:1.4deg;--ty:18px">
        <div class="frame">
          <span class="nail" aria-hidden="true"></span>
          <div class="frame-mat">
            <img src="assets/memory-2.jpg" alt="回忆 02 · 花信琴房" draggable="false">
          </div>
          <span class="gloss" aria-hidden="true"></span>
        </div>
        <figcaption><span class="no">02</span><span class="cap">花信 · 琴房</span></figcaption>
      </figure>
    </div>

    <button class="reset" id="reset" type="button"><span>重 新 封 存</span></button>
  </div>
</section>

<!-- 大图 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lb-veil" data-close></div>
  <figure class="lb-box">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="lb-close" type="button" data-close aria-label="关闭">✕</button>
</div>

<!-- 载入 -->
<div class="loader" id="loader" aria-hidden="true">
  <span class="loader-line"><i></i></span>
  <span class="loader-text">MEMORY WALL</span>
</div>

<script src="js/app.js"></script>
</body>
</html>
